<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">Published images from private storage to the edge</title><desc id="desc">A server-side build uses a delivery token to export selected currently published images from private Storypane storage to content-hashed public copies. Cloudflare transforms and caches variants for visitors. Draft previews stay authenticated; removal of exported images requires deleting and purging public copies.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6fe8ee"/></marker></defs><rect width="600" height="790" rx="16" fill="#080f19"/><g font-family="sans-serif"><text x="36" y="47" fill="#f0f5fa" font-size="26" font-weight="600">Published images, optimized at the edge</text><text x="36" y="82" fill="#a9b7c7" font-size="17">Public exports are separate from authenticated CMS media.</text><rect x="36" y="112" width="528" height="124" rx="10" fill="#101b29" stroke="#375562"/><text x="58" y="137" fill="#6fe8ee" font-size="14" letter-spacing="1">01 / PRIVATE STORAGE</text><text x="58" y="169" fill="#f0f5fa" font-size="25" font-weight="600">Preserve your originals</text><text x="58" y="197" fill="#a9b7c7" font-size="22">Storypane keeps original media in its</text><text x="58" y="223" fill="#a9b7c7" font-size="22">private bucket.</text><path d="M300 236v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="263" width="528" height="124" rx="10" fill="#101b29" stroke="#375562"/><text x="58" y="288" fill="#6fe8ee" font-size="14" letter-spacing="1">02 / SERVER-SIDE BUILD</text><text x="58" y="320" fill="#f0f5fa" font-size="25" font-weight="600">Export selected publications</text><text x="58" y="348" fill="#a9b7c7" font-size="22">A delivery token fetches only currently</text><text x="58" y="374" fill="#a9b7c7" font-size="22">published media.</text><path d="M300 387v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="414" width="528" height="124" rx="10" fill="#101b29" stroke="#375562"/><text x="58" y="439" fill="#6fe8ee" font-size="14" letter-spacing="1">03 / PUBLIC SOURCE</text><text x="58" y="471" fill="#f0f5fa" font-size="25" font-weight="600">Serve versioned public copies</text><text x="58" y="499" fill="#a9b7c7" font-size="22">Content-hashed paths identify the exact</text><text x="58" y="525" fill="#a9b7c7" font-size="22">exported bytes.</text><path d="M300 538v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="565" width="528" height="124" rx="10" fill="#101b29" stroke="#375562"/><text x="58" y="590" fill="#6fe8ee" font-size="14" letter-spacing="1">04 / EDGE DELIVERY</text><text x="58" y="622" fill="#f0f5fa" font-size="25" font-weight="600">Resize and optimize at the CDN</text><text x="58" y="650" fill="#a9b7c7" font-size="22">Visitors request responsive variants</text><text x="58" y="676" fill="#a9b7c7" font-size="22">without a CMS token.</text><text x="36" y="741" fill="#a9b7c7" font-size="18">Drafts and private previews stay on CMS routes.</text><text x="36" y="766" fill="#a9b7c7" font-size="18">Remove and purge public copies when required.</text></g></svg>
