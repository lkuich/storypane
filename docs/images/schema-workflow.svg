<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">Schema changes: dev to production</title><desc id="desc">Deploy and test in dev before reviewing production impact. Start from production. Sync incoming schema changes into your linked dev space. Change and deploy in dev. Stage a migration, deploy it in dev, and test sample content. Promote deployed changes. Review actual production impact; resolve blockers first. Protect production, keep working. Apply the reviewed batch. Other developers then sync. Production stays schema read-only. Content publication is separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6fe8ee" /></marker></defs><rect width="600" height="790" rx="16" fill="#080f19" /><g font-family="sans-serif"><text x="36" y="47" fill="#f0f5fa" font-size="28" font-weight="600">Schema changes: dev to production</text><text x="36" y="82" fill="#a9b7c7" font-size="17">Deploy and test in dev before reviewing production impact.</text><rect x="36" y="112" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="137" fill="#6fe8ee" font-size="14" letter-spacing="1">01 / SYNC</text><text x="58" y="169" fill="#f0f5fa" font-size="24" font-weight="600">Start from production</text><path d="M300 236v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="263" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="288" fill="#6fe8ee" font-size="14" letter-spacing="1">02 / DEVELOP</text><text x="58" y="320" fill="#f0f5fa" font-size="24" font-weight="600">Change and deploy in dev</text><path d="M300 387v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="414" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="439" fill="#6fe8ee" font-size="14" letter-spacing="1">03 / REVIEW</text><text x="58" y="471" fill="#f0f5fa" font-size="24" font-weight="600">Promote deployed changes</text><path d="M300 538v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="565" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="590" fill="#6fe8ee" font-size="14" letter-spacing="1">04 / APPLY</text><text x="58" y="622" fill="#f0f5fa" font-size="24" font-weight="600">Protect production, keep working</text><text x="58" y="197" fill="#a9b7c7" font-size="22">Sync incoming schema changes into your</text><text x="58" y="223" fill="#a9b7c7" font-size="22">linked dev space.</text><text x="58" y="348" fill="#a9b7c7" font-size="22">Stage a migration, deploy it in dev, and</text><text x="58" y="374" fill="#a9b7c7" font-size="22">test sample content.</text><text x="58" y="499" fill="#a9b7c7" font-size="22">Review actual production impact; resolve</text><text x="58" y="525" fill="#a9b7c7" font-size="22">blockers first.</text><text x="58" y="650" fill="#a9b7c7" font-size="22">Apply the reviewed batch. Other developers</text><text x="58" y="676" fill="#a9b7c7" font-size="22">then sync.</text><text x="36" y="741" fill="#a9b7c7" font-size="18">Production stays schema read-only. Content publication is</text><text x="36" y="766" fill="#a9b7c7" font-size="18">separate.</text></g></svg>
