<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">From publication to website rebuild</title><desc id="desc">Durable events connect your CMS to your existing build system. Publish and enqueue. Publication and its event are recorded in one transaction. Send a signed HTTPS request. The queue retries transient failures. Delivery is at least once. Check signature and space. The receiver verifies raw bytes and deduplicates the event ID. Read published content. Queue a build using your own server-held delivery credentials. Payloads contain identifiers and paths, not content or credentials.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6fe8ee" /></marker></defs><rect width="600" height="790" rx="16" fill="#080f19" /><g font-family="sans-serif"><text x="36" y="47" fill="#f0f5fa" font-size="28" font-weight="600">From publication to website rebuild</text><text x="36" y="82" fill="#a9b7c7" font-size="17">Durable events connect your CMS to your existing build system.</text><rect x="36" y="112" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="137" fill="#6fe8ee" font-size="14" letter-spacing="1">01 / COMMIT</text><text x="58" y="169" fill="#f0f5fa" font-size="24" font-weight="600">Publish and enqueue</text><path d="M300 236v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="263" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="288" fill="#6fe8ee" font-size="14" letter-spacing="1">02 / DELIVER</text><text x="58" y="320" fill="#f0f5fa" font-size="24" font-weight="600">Send a signed HTTPS request</text><path d="M300 387v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="414" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="439" fill="#6fe8ee" font-size="14" letter-spacing="1">03 / VERIFY</text><text x="58" y="471" fill="#f0f5fa" font-size="24" font-weight="600">Check signature and space</text><path d="M300 538v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="565" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="590" fill="#6fe8ee" font-size="14" letter-spacing="1">04 / BUILD</text><text x="58" y="622" fill="#f0f5fa" font-size="24" font-weight="600">Read published content</text><text x="58" y="197" fill="#a9b7c7" font-size="22">Publication and its event are recorded in</text><text x="58" y="223" fill="#a9b7c7" font-size="22">one transaction.</text><text x="58" y="348" fill="#a9b7c7" font-size="22">The queue retries transient failures.</text><text x="58" y="374" fill="#a9b7c7" font-size="22">Delivery is at least once.</text><text x="58" y="499" fill="#a9b7c7" font-size="22">The receiver verifies raw bytes and</text><text x="58" y="525" fill="#a9b7c7" font-size="22">deduplicates the event ID.</text><text x="58" y="650" fill="#a9b7c7" font-size="22">Queue a build using your own server-held</text><text x="58" y="676" fill="#a9b7c7" font-size="22">delivery credentials.</text><text x="36" y="741" fill="#a9b7c7" font-size="18">Payloads contain identifiers and paths, not content or</text><text x="36" y="766" fill="#a9b7c7" font-size="18">credentials.</text></g></svg>
