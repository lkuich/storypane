<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">Live preview connection</title>
  <desc id="desc">The CMS editor loads your frontend in an iframe. The frontend requests a preview grant through postMessage. The editor obtains a scoped grant from the CMS server and passes it back. The frontend opens an authenticated WebSocket and receives saved draft JSON to render.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#6fe8ee"/></marker>
  </defs>
  <rect width="720" height="640" rx="16" fill="#080f19"/>
  <g fill="#101b29" stroke="#375562" stroke-width="1.5">
    <rect x="20" y="24" width="200" height="88" rx="10"/>
    <rect x="260" y="24" width="200" height="88" rx="10"/>
    <rect x="500" y="24" width="200" height="88" rx="10"/>
  </g>
  <g stroke="#375562" stroke-width="1.5" stroke-dasharray="5 6">
    <path d="M120 112V610"/><path d="M360 112V610"/><path d="M600 112V610"/>
  </g>
  <g fill="none" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)">
    <path d="M120 174H360"/>
    <path d="M360 254H120"/>
    <path d="M120 334H600"/>
    <path d="M600 414H120"/>
    <path d="M120 494H360"/>
    <path d="M600 574H360" marker-start="url(#arrow)"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#f0f5fa">
    <g font-size="23" font-weight="600">
      <text x="120" y="63">Editor</text>
      <text x="360" y="63">Your frontend</text>
      <text x="600" y="63">CMS server</text>
    </g>
    <g font-size="17" fill="#a9b7c7">
      <text x="120" y="90">Authenticated browser</text>
      <text x="360" y="90">Preview iframe + SDK</text>
      <text x="600" y="90">Authorization + drafts</text>
      <text x="240" y="156">1. Load preview route</text>
      <text x="240" y="236">2. Ask parent for a session</text>
      <text x="360" y="316">3. Request scoped preview access</text>
      <text x="360" y="396">4. Return short-lived grant</text>
      <text x="240" y="476">5. Pass grant (postMessage)</text>
      <text x="480" y="556">6. Draft JSON over WebSocket</text>
    </g>
  </g>
</svg>
