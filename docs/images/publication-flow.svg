<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">From draft to published page</title><desc id="desc">Saving content and publishing it are separate decisions. Autosave a draft. Your saved changes are available to authorized editors and preview. Review one saved revision. Resolve validation and required approvals before publishing. Publish the reviewed snapshot. Delivery reads that fixed publication; later edits remain drafts. Rebuild or revalidate. Your frontend updates its routes, metadata, and cached pages. A schema migration does not publish unfinished content.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6fe8ee" /></marker></defs><rect width="600" height="790" rx="16" fill="#080f19" /><g font-family="sans-serif"><text x="36" y="47" fill="#f0f5fa" font-size="28" font-weight="600">From draft to published page</text><text x="36" y="82" fill="#a9b7c7" font-size="17">Saving content and publishing it are separate decisions.</text><rect x="36" y="112" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="137" fill="#6fe8ee" font-size="14" letter-spacing="1">01 / EDIT</text><text x="58" y="169" fill="#f0f5fa" font-size="24" font-weight="600">Autosave a draft</text><path d="M300 236v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="263" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="288" fill="#6fe8ee" font-size="14" letter-spacing="1">02 / REVIEW</text><text x="58" y="320" fill="#f0f5fa" font-size="24" font-weight="600">Review one saved revision</text><path d="M300 387v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="414" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="439" fill="#6fe8ee" font-size="14" letter-spacing="1">03 / PUBLISH</text><text x="58" y="471" fill="#f0f5fa" font-size="24" font-weight="600">Publish the reviewed snapshot</text><path d="M300 538v24" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="565" width="528" height="124" rx="10" fill="#101b29" stroke="#375562" /><text x="58" y="590" fill="#6fe8ee" font-size="14" letter-spacing="1">04 / UPDATE THE SITE</text><text x="58" y="622" fill="#f0f5fa" font-size="24" font-weight="600">Rebuild or revalidate</text><text x="58" y="197" fill="#a9b7c7" font-size="22">Your saved changes are available to</text><text x="58" y="223" fill="#a9b7c7" font-size="22">authorized editors and preview.</text><text x="58" y="348" fill="#a9b7c7" font-size="22">Resolve validation and required approvals</text><text x="58" y="374" fill="#a9b7c7" font-size="22">before publishing.</text><text x="58" y="499" fill="#a9b7c7" font-size="22">Delivery reads that fixed publication; later</text><text x="58" y="525" fill="#a9b7c7" font-size="22">edits remain drafts.</text><text x="58" y="650" fill="#a9b7c7" font-size="22">Your frontend updates its routes, metadata,</text><text x="58" y="676" fill="#a9b7c7" font-size="22">and cached pages.</text><text x="36" y="741" fill="#a9b7c7" font-size="18">A schema migration does not publish unfinished content.</text></g></svg>
