<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
  <title id="title">Storypane architecture</title>
  <desc id="desc">The editor browser and your website server or build communicate with one Storypane Node application. It uses an installation PostgreSQL database, a separate PostgreSQL database per space, and private S3-compatible storage for original media.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#6fe8ee"/></marker>
  </defs>
  <rect width="720" height="610" rx="16" fill="#080f19"/>
  <g fill="#101b29" stroke="#375562" stroke-width="1.5">
    <rect x="24" y="24" width="300" height="96" rx="10"/>
    <rect x="396" y="24" width="300" height="96" rx="10"/>
    <rect x="130" y="218" width="460" height="126" rx="10" stroke="#6fe8ee"/>
    <rect x="24" y="450" width="208" height="136" rx="10"/>
    <rect x="256" y="450" width="208" height="136" rx="10"/>
    <rect x="488" y="450" width="208" height="136" rx="10"/>
  </g>
  <g fill="none" stroke="#6fe8ee" stroke-width="2" marker-end="url(#arrow)">
    <path d="M174 120V169H246V218" marker-start="url(#arrow)"/>
    <path d="M546 120V169H474V218" marker-start="url(#arrow)"/>
    <path d="M360 344V394H128V450"/>
    <path d="M360 394V450"/>
    <path d="M360 394H592V450"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#f0f5fa">
    <g font-size="24" font-weight="600">
      <text x="174" y="65">Editor browser</text>
      <text x="546" y="65">Your website</text>
      <text x="360" y="263">Storypane Node application</text>
    </g>
    <g font-size="18" fill="#a9b7c7">
      <text x="174" y="95">React editor + live preview</text>
      <text x="546" y="95">Server or build + SDK</text>
      <text x="360" y="298">Editor + APIs + collaboration</text>
      <text x="360" y="324">Images + background jobs</text>
      <text x="90" y="198">HTTP + WebSocket</text>
      <text x="602" y="198">Published JSON</text>
    </g>
    <g font-size="21" font-weight="600">
      <text x="128" y="485">Installation DB</text>
      <text x="360" y="485">Space databases</text>
      <text x="592" y="485">Private files</text>
    </g>
    <g font-size="18" fill="#a9b7c7">
      <text x="128" y="518">PostgreSQL</text><text x="128" y="545">Identities + registry</text>
      <text x="360" y="518">PostgreSQL</text><text x="360" y="545">Content + history</text>
      <text x="592" y="518">S3-compatible</text><text x="592" y="545">Original media</text>
    </g>
  </g>
</svg>
