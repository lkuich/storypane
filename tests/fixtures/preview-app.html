<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Static Storypane SDK fixture</title>
<style>body{font:16px system-ui;margin:0;color:#153d32;background:#fbfaf5}header{padding:24px 32px;border-bottom:1px solid #deded5}main{padding:40px 32px}section{padding:16px;margin-bottom:24px}h1{font-size:40px;max-width:650px;line-height:1.15}footer{padding:20px 32px;color:#597367}small{font-size:12px}</style></head><body>
<header><strong>Static website</strong> <small>Built once · Previewed live</small></header><main id="content">__HTML__</main><footer><small id="status">Published content</small></footer>
<script id="initial" type="application/json">__INITIAL__</script>
<script type="module">
import { connectPreview, editable } from '/sdk/preview.js';
const { story:initial, spaceId, cmsUrl } = JSON.parse(document.getElementById('initial').textContent);
function render(story) {
  function block(value) {
    const section = document.createElement('section');
    for (const [key,attribute] of Object.entries(editable(value))) section.setAttribute(key,attribute);
    section.tabIndex = 0;
    if (value.title || value.text) { const text = document.createElement(value.component === 'hero' ? 'h1' : 'p'); text.textContent = value.title || value.text; section.append(text); }
    for (const child of value.body ?? []) section.append(block(child));
    return section;
  }
  document.getElementById('content').replaceChildren(block(story.content));
}
connectPreview({ cmsUrl, spaceId, story:{ id:initial.id,locale:new URL(location.href).searchParams.get('locale') ?? initial.locale },
  mode:{ query:{ name:'review',value:'1' }, cookie:{ name:'fixture_preview',value:'allowed' } },
  getSession: window.parent === window ? async () => { const response = await fetch('/session',{ method:'POST' }); if (!response.ok) throw new Error('Sign in to preview'); return response.json(); } : undefined,
  onChange:render, onStatus:(status,error) => { document.getElementById('status').textContent = error?.message ?? status; }
});
</script></body></html>
