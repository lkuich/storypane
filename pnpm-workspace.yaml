packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - vinext@1.4.2
  - '@better-auth/core@1.7.18'
  - '@better-auth/drizzle-adapter@1.7.18'
  - '@better-auth/kysely-adapter@1.7.18'
  - '@better-auth/memory-adapter@1.7.18'
  - '@better-auth/mongo-adapter@1.7.18'
  - '@better-auth/prisma-adapter@1.7.18'
  - '@better-auth/telemetry@1.7.18'
  - better-auth@1.7.18

patchedDependencies:
  # Use Sharp's real types instead of vinext's optional-dependency placeholder.
  '@vinext/types@1.0.2': patches/@vinext__types@1.0.2.patch
